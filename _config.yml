collections:
  news:
    output: true
    permalink: /news/:name/
  use_cases:
    output: true
    permalink: /use-cases/:name/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: news-post
  - scope:
      path: ""
      type: use_cases
    values:
      layout: use-case

exclude:
  - README.md

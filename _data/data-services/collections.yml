# Collection card schema:
# - image: card image path
# - tag / tag_class: optional badge overlay
# - title / text / size / access: card copy
# - dashboard_links: optional list of { label, url } dashboard buttons (rendered in first row).
# - data_links: optional list of { label, url } data buttons (rendered in second row).
#   If both are omitted or empty, the card shows "Coming Soon".

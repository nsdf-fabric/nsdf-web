# Entry card schema:
# - icon: glyph rendered in the round icon badge
# - icon_class: "entry-blue" | "entry-green" | "entry-purple"
# - title / text: card heading and description
# - links: optional list of { label, url } buttons rendered under the text.
#   Only these buttons are clickable. If omitted or empty, the card shows
#   "Coming Soon".
# - id: optional anchor id applied to the card
#
# Example:
# - icon: "▣"
#   icon_class: "entry-blue"
#   title: "Data Portal"
#   text: "Access selected datasets, collections, dashboards, and domain-specific data experiences."
#   links:
#     - label: "Explore Dashboard"
#       url: "https://example.com/dashboard"
#     - label: "Explore Data"
#       url: "https://example.com/data"
#   id: "data-portal"
#
# - icon: "▣"
#   icon_class: "entry-blue"

---
layout: default
---
<article class="detail-page">
  <header class="detail-hero">
    <div class="detail-hero-content">
      <p class="eyebrow light">{{ page.eyebrow }}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  <section class="detail-content">
    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.image_alt }}" class="detail-article-image" />
    {% endif %}
    {{ content }}
    <a class="btn btn-primary" href="/use-cases/">Back to all use cases <span>&rarr;</span></a>
  </section>
</article>
